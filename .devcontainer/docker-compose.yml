services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  devcontainer:
    image: sensor-agent-devcontainer:local
    volumes:
      - ../.:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      - mqtt
    cap_add:
      - NET_RAW