services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ../mosquitto/config:/mosquitto/config:ro
      - ../mosquitto/certs:/mosquitto/certs:ro
    restart: unless-stopped

  devcontainer:
    image: sensor-agent-devcontainer:local
    volumes:
      - ../.:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      - mqtt
    cap_add:
      - NET_RAW